<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket Console</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root {
    color-scheme:dark;
    --bg:#000000; --surface:#0b0b0e; --surface-2:#111115; --fg:#f2f3f7; --muted:#9da3b2; --faint:#6b7080;
    --line:#1c1c22; --line-strong:#2a2a33;
    --accent:#8083ff; --accent-2:#a78bfa; --accent-soft:rgba(128,131,255,.14);
    --ok:#4ade9b; --ok-soft:rgba(74,222,155,.12); --warn:#fbbf6a; --warn-soft:rgba(251,191,106,.12); --bad:#ff8a7a; --bad-soft:rgba(255,138,122,.12);
    --shadow:0 1px 2px rgba(0,0,0,.6); --shadow-lg:0 16px 40px rgba(0,0,0,.8);
    --glow:radial-gradient(900px 380px at 15% -10%, rgba(128,131,255,.10), transparent 60%), radial-gradient(700px 320px at 95% -20%, rgba(167,139,250,.08), transparent 60%);
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg) var(--glow) no-repeat; color:var(--fg);
    font:14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .mono { font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12.5px; }

  /* Top bar */
  .topbar { position:sticky; top:0; z-index:20; backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb, var(--bg) 72%, transparent); border-bottom:1px solid var(--line); }
  .topbar-in { max-width:1760px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:-.01em; font-size:15px; }
  .logo { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; place-items:center; color:#fff; box-shadow:0 4px 12px rgba(91,91,240,.35); }
  .logo svg { width:16px; height:16px; }
  .tabs { display:flex; gap:2px; padding:3px; background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
  .tab { appearance:none; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:500; padding:6px 14px;
    border-radius:7px; cursor:pointer; display:flex; align-items:center; gap:8px; transition:.15s; }
  .tab:hover { color:var(--fg); }
  .tab.active { background:var(--fg); color:var(--bg); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .tab .n { font-size:11px; padding:1px 7px; border-radius:99px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tab.active .n { background:color-mix(in srgb, var(--bg) 22%, transparent); color:var(--bg); }
  .grow { flex:1; }
  .ctl { display:flex; align-items:center; gap:8px; }
  .field { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:0 10px; height:34px; box-shadow:var(--shadow); transition:.15s; color:var(--muted); }
  .field:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .field input { border:0; outline:0; background:transparent; color:var(--fg); font:inherit; width:100%; min-width:0; }
  .field svg { width:15px; height:15px; flex:none; }
  .field label { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600; }
  .search { width:240px; }
  .field select { border:0; outline:0; background:transparent; color:var(--fg); font:inherit; font-weight:500; cursor:pointer; max-width:150px; }
  .field select option { background:var(--surface); color:var(--fg); }
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .filters .field { box-shadow:none; }
  .clear { appearance:none; border:0; background:transparent; color:var(--muted); font:inherit; cursor:pointer; padding:0 6px; }
  .clear:hover { color:var(--accent); }
  .attn { margin-left:8px; }
  .proj { width:130px; } .proj input { width:64px; font-weight:500; }
  .days { width:110px; } .days input { width:44px; }
  .btn { appearance:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--fg); font:inherit; font-weight:500;
    height:34px; padding:0 14px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; box-shadow:var(--shadow); transition:.15s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn svg { width:15px; height:15px; }
  .btn.spin svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Layout */
  main { max-width:1760px; margin:0 auto; padding:24px; }
  .pagehead { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { margin:0; font-size:24px; letter-spacing:-.02em; font-weight:700; }
  .sub { color:var(--muted); margin:2px 0 0; }
  .notice { display:flex; gap:10px; align-items:center; background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 25%, transparent);
    padding:10px 14px; border-radius:10px; margin-bottom:16px; font-size:13px; }
  .notice.err { background:var(--bad-soft); color:var(--bad); border-color:color-mix(in srgb, var(--bad) 25%, transparent); }
  .notice code { font-family:"JetBrains Mono", monospace; font-size:12px; background:color-mix(in srgb, currentColor 12%, transparent); padding:1px 6px; border-radius:5px; }

  /* Stat cards */
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:20px; }
  .stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--c, var(--accent)); }
  .stat .k { color:var(--muted); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:.05em; }
  .stat .v { font-size:30px; font-weight:700; letter-spacing:-.03em; margin-top:4px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat .h { color:var(--faint); font-size:12px; margin-top:4px; }

  /* Table card */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-bottom:20px; }
  .card-h { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .card-h h2 { margin:0; font-size:14px; font-weight:600; }
  .card-h .pill { margin-left:2px; }
  .scroll { overflow-x:auto; } /* only kicks in on very narrow windows */
  table { width:100%; border-collapse:separate; border-spacing:0; }
  th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); font-weight:600;
    padding:10px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:12px 12px; border-bottom:1px solid var(--line); vertical-align:middle; overflow-wrap:anywhere; }
  /* Fit the card width: long text wraps, short items (links, pills, buttons, times) never break. */
  td .ulink, td .pill, td .eco, td .who, td .close-btn, td.num, td.mono, td .mono { white-space:nowrap; overflow-wrap:normal; }
  td.pkg { min-width:110px; }
  tbody tr { transition:background .12s; }
  tbody tr:hover { background:var(--surface-2); }
  tbody tr:last-child td { border-bottom:0; }
  td.num { color:var(--muted); }
  a { color:var(--accent); text-decoration:none; font-weight:500; } a:hover { text-decoration:underline; }
  .ulink { display:inline-flex; align-items:center; gap:6px; }
  .ulink svg { width:12px; height:12px; flex:none; opacity:.55; transition:.15s; }
  .ulink:hover svg { opacity:1; transform:translate(1px,-1px); }
  .mr-link span { overflow:hidden; text-overflow:ellipsis; }
  .key { font-weight:600; }
  .pkg { font-weight:600; }
  .ver { color:var(--muted); }
  .mr-link { display:inline-flex; align-items:center; gap:6px; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
  .none { color:var(--faint); }
  .right { text-align:right; }

  /* Pills / chips */
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px; line-height:1.6; background:var(--accent-soft); color:var(--accent); }
  .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.plain::before { display:none; }
  .pill.ok { background:var(--ok-soft); color:var(--ok); }
  .pill.off { background:color-mix(in srgb, var(--faint) 14%, transparent); color:var(--muted); }
  .pill.warn { background:var(--warn-soft); color:var(--warn); }
  .pill.bad { background:var(--bad-soft); color:var(--bad); }
  .eco { font-size:12px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); }

  .close-btn { appearance:none; font:inherit; font-size:12px; font-weight:600; cursor:pointer; color:var(--bad); background:transparent;
    border:1px solid color-mix(in srgb, var(--bad) 40%, transparent); padding:4px 12px; border-radius:8px; transition:.15s; }
  .close-btn:hover { background:var(--bad); color:#fff; border-color:var(--bad); }
  .close-btn:disabled { opacity:.5; cursor:default; }

  /* Avatars */
  .who { display:inline-flex; align-items:center; gap:10px; font-weight:500; }
  .av { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:700; color:#fff; background:var(--c, #64748b); flex:none; }
  .av svg { width:14px; height:14px; }

  /* Day header */
  .day-h { display:flex; align-items:center; justify-content:space-between; }
  .day-h .t { font-weight:600; font-size:14px; display:flex; align-items:center; gap:10px; }
  .day-h .d { color:var(--faint); font-weight:400; }

  /* Skeleton + empty */
  .sk { height:12px; border-radius:6px; background:linear-gradient(90deg, var(--line) 25%, var(--surface-2) 37%, var(--line) 63%); background-size:400% 100%; animation:sh 1.4s ease infinite; }
  @keyframes sh { 0% { background-position:100% 50%; } 100% { background-position:0 50%; } }
  .empty { padding:56px 20px; text-align:center; color:var(--muted); }
  .empty .ic { width:44px; height:44px; margin:0 auto 12px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
  .empty .ic svg { width:22px; height:22px; }
  .empty b { display:block; color:var(--fg); font-size:15px; margin-bottom:2px; }

  /* Modal + toast */
  .overlay { position:fixed; inset:0; background:rgba(8,10,16,.55); backdrop-filter:blur(4px); display:grid; place-items:center; z-index:50; padding:20px; animation:fade .15s; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-width:440px; padding:22px; animation:pop .18s; }
  .modal .mi { width:40px; height:40px; border-radius:11px; background:var(--bad-soft); color:var(--bad); display:grid; place-items:center; margin-bottom:12px; }
  .modal .mi svg { width:20px; height:20px; }
  .modal h3 { margin:0 0 6px; font-size:17px; letter-spacing:-.01em; }
  .modal p { margin:0 0 12px; color:var(--muted); }
  .modal .url { word-break:break-all; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:9px 11px; color:var(--fg); margin-bottom:18px; }
  .modal .row { display:flex; gap:10px; justify-content:flex-end; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  .btn.danger:hover { filter:brightness(1.08); color:#fff; }
  @keyframes fade { from { opacity:0; } } @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } }
  .toasts { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:10px; z-index:60; }
  .toast { background:var(--fg); color:var(--bg); padding:11px 16px; border-radius:11px; box-shadow:var(--shadow-lg); font-weight:500; max-width:380px; animation:pop .2s; }
  .toast.bad { background:var(--bad); color:#fff; }
  [hidden] { display:none !important; }
  @media (max-width:720px) { main, .topbar-in { padding-left:16px; padding-right:16px; } .search { width:100%; } .grow { display:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></symbol>
</svg>

<header class="topbar"><div class="topbar-in">
  <div class="brand"><span class="logo"><svg><use href="#i-bolt"/></svg></span>Ticket Console</div>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-todo" role="tab">To Do <span class="n" id="n-todo">–</span></button>
    <button class="tab" id="tab-done" role="tab">Done <span class="n" id="n-done">–</span></button>
  </div>
  <span class="grow"></span>
  <div class="ctl">
    <div class="field search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Filter tickets…" autocomplete="off"></div>
    <div class="field proj"><label for="project">Project</label><input id="project" type="text" spellcheck="false"></div>
    <div class="field days" id="days-wrap" hidden><label for="days">Days</label><input id="days" type="number" min="1" max="90" value="1"></div>
    <button class="btn" id="export"><svg><use href="#i-download"/></svg>Export TXT</button>
    <button class="btn" id="refresh"><svg><use href="#i-refresh"/></svg>Refresh</button>
  </div>
</div></header>

<main>
  <div class="pagehead">
    <div><h1 id="title">To Do</h1><p class="sub" id="subtitle"></p></div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div class="filters" id="filters">
    <div class="field"><label for="eco">Ecosystem</label><select id="eco"><option value="">All</option></select></div>
    <div class="field"><label for="pkg">Package</label><select id="pkg"><option value="">All</option></select></div>
    <div class="field"><label for="ver">Version</label><select id="ver"><option value="">All</option></select></div>
    <div class="field"><label for="mrf">MR</label><select id="mrf">
      <option value="">All</option><option value="opened">Open</option><option value="merged">Merged</option><option value="closed">Closed</option><option value="none">No MR</option></select></div>
    <div class="field" id="patch-f"><label for="patchf">Patch</label><select id="patchf">
      <option value="">All</option><option value="yes">Ready</option><option value="no">Missing</option></select></div>
    <div class="field" id="by-f" hidden><label for="byf">Resolved by</label><select id="byf"><option value="">All</option></select></div>
    <div class="field" id="attn-f"><label for="attnf">Show</label><select id="attnf">
      <option value="">Everything</option><option value="1">Needs attention</option></select></div>
    <button class="clear" id="clear">Clear filters</button>
  </div>
  <div class="stats" id="stats"></div>
  <div id="content"></div>
</main>
<div class="toasts" id="toasts"></div>

<script>
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
let view = { todo: [], done: [] };
let tab = "todo", gitlabOk = false, data = { todo: null, done: null }, reqSeq = 0;

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k === "class" ? e.className = v : (e[k] = v);
  kids.forEach(k => k != null && e.append(k));
  return e;
}
function icon(id) { const s = document.createElementNS(NS, "svg"), u = document.createElementNS(NS, "use"); u.setAttribute("href", "#" + id); s.append(u); return s; }
const safeHref = u => /^https?:\/\//i.test(u);
const link = (href, text, cls) => {
  const a = el("a", { href, target: "_blank", rel: "noopener noreferrer", class: ("ulink " + (cls || "")).trim() }, el("span", { textContent: text }), icon("i-ext"));
  return a;
};
const pill = (text, kind = "") => el("span", { class: "pill " + kind, textContent: text });

function toast(msg, bad) {
  const t = el("div", { class: "toast" + (bad ? " bad" : ""), textContent: msg });
  $("toasts").append(t); setTimeout(() => t.remove(), 4200);
}
function notice(msg, err) {
  const n = $("notice"); n.hidden = !msg; n.className = "notice" + (err ? " err" : "");
  n.replaceChildren(icon("i-warn"), el("span", { textContent: msg || "" }));
  n.firstChild.style.cssText = "width:16px;height:16px;flex:none";
}

async function api(path) {
  const r = await fetch(path); const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

/* ---------- confirm modal ---------- */
function confirmClose(mrUrl) {
  return new Promise(resolve => {
    const done = v => { ov.remove(); document.removeEventListener("keydown", onKey); resolve(v); };
    const onKey = e => e.key === "Escape" && done(false);
    const cancel = el("button", { class: "btn", textContent: "Cancel", onclick: () => done(false) });
    const ok = el("button", { class: "btn danger", textContent: "Close merge request", onclick: () => done(true) });
    const ov = el("div", { class: "overlay", onclick: e => e.target === ov && done(false) },
      el("div", { class: "modal", role: "dialog", "aria-modal": "true" },
        el("div", { class: "mi" }, icon("i-warn")),
        el("h3", { textContent: "Close this merge request?" }),
        el("p", { textContent: "It will be closed without merging. You can reopen it later in GitLab." }),
        el("div", { class: "url mono", textContent: mrUrl }),
        el("div", { class: "row" }, cancel, ok)));
    ov.querySelector("svg").style.cssText = "width:20px;height:20px";
    document.body.append(ov); document.addEventListener("keydown", onKey); ok.focus();
  });
}
async function closeMr(row, btn, cell) {
  if (!await confirmClose(row.mr)) return;
  btn.disabled = true; btn.textContent = "Closing…";
  try {
    const r = await fetch("/api/close-mr", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: row.mr }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error);
    cell.replaceChildren(pill("MR " + d.state, "off")); toast(`${row.key}: merge request ${d.state}`);
  } catch (e) { btn.disabled = false; btn.textContent = "Close MR"; toast("Could not close MR: " + e.message, true); }
}

/* ---------- rendering ---------- */
function statCard(k, v, h, color) {
  return el("div", { class: "stat", style: color ? `--c:${color}` : "" }, el("div", { class: "k", textContent: k }), el("div", { class: "v", textContent: v }), el("div", { class: "h", textContent: h || "" }));
}
function skeleton() {
  const body = el("tbody");
  for (let i = 0; i < 6; i++) body.append(el("tr", {}, ...[90, 120, 60, 140, 70, 50].map(w => el("td", {}, el("div", { class: "sk", style: `width:${w}px` })))));
  return el("div", { class: "card" }, el("div", { class: "scroll" }, el("table", {}, el("tbody", {}, ...body.children))));
}
function empty(title, text) {
  return el("div", { class: "card" }, el("div", { class: "empty" }, el("div", { class: "ic" }, icon("i-inbox")), el("b", { textContent: title }), el("span", { textContent: text })));
}
function syncOptions(id, values) {
  const sel = $(id), cur = sel.value;
  const list = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  sel.replaceChildren(el("option", { value: "", textContent: "All" }), ...list.map(e => el("option", { value: e, textContent: e })));
  sel.value = list.includes(cur) ? cur : "";
  return sel.value;
}
// Package list narrows to the chosen ecosystem; version list narrows to the chosen package.
function syncPkg(rows, eco) { return syncOptions("pkg", rows.filter(r => !eco || r.ecosystem === eco).map(r => r.package)); }
function syncVer(rows, eco, pkg) { return syncOptions("ver", rows.filter(r => (!eco || r.ecosystem === eco) && (!pkg || r.package === pkg)).map(r => r.version)); }
function syncEco(rows) {
  const sel = $("eco"), cur = sel.value;
  const list = [...new Set(rows.map(r => r.ecosystem).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  sel.replaceChildren(el("option", { value: "", textContent: "All" }), ...list.map(e => el("option", { value: e, textContent: e })));
  sel.value = list.includes(cur) ? cur : "";
  return sel.value;
}
function attention(r) {
  if (r.mr_state === "merged") return "MR merged — ticket still To Do";
  if (r.patch === "yes" && !r.mr) return "Patch ready, no MR yet";
  return "";
}
function mrKind(r) { return !r.mr ? "none" : (r.mr_state || "unknown"); }
function syncBy(rows) {
  const sel = $("byf"), cur = sel.value;
  const list = [...new Set(rows.map(r => r.resolved_by).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  sel.replaceChildren(el("option", { value: "", textContent: "All" }), ...list.map(e => el("option", { value: e, textContent: e })));
  sel.value = list.includes(cur) ? cur : "";
  return sel.value;
}
function filtersActive() { return ["eco", "pkg", "ver", "mrf", "patchf", "byf", "attnf"].some(id => $(id).value) || $("q").value.trim(); }

const match = (q, ...f) => !q || f.join(" ").toLowerCase().includes(q);

function mrCells(r) {
  const act = el("td", { class: "right" });
  const st = r.mr_state;
  if (st === "merged") act.append(pill("Merged", "ok"));
  else if (st === "closed") act.append(pill("Closed", "off"));
  else if (r.mr && safeHref(r.mr) && gitlabOk) { const b = el("button", { class: "close-btn", textContent: "Close MR" }); b.onclick = () => closeMr(r, b, act); act.append(b); }
  const mr = el("td", {}, r.mr && safeHref(r.mr) ? link(r.mr, "!" + r.mr.split("/").pop(), "mr-link mono") : pill("No MR", "off"));
  return [mr, act];
}

function renderTodo() {
  const rows = data.todo; if (!rows) return;
  const q = $("q").value.trim().toLowerCase();
  const eco = syncEco(rows), pkg = syncPkg(rows, eco), ver = syncVer(rows, eco, pkg);
  const shown = rows.filter(r => (!eco || r.ecosystem === eco) && (!pkg || r.package === pkg) && (!ver || r.version === ver)
    && (!$("mrf").value || mrKind(r) === $("mrf").value)
    && (!$("patchf").value || r.patch === $("patchf").value)
    && (!$("attnf").value || attention(r))
    && match(q, r.key, r.vuln_id, r.ecosystem, r.package, r.version));
  view.todo = shown;
  $("title").textContent = "To Do"; $("subtitle").textContent = "Open vulnerability tickets assigned to you.";
  const patched = rows.filter(r => r.patch === "yes").length, withMr = rows.filter(r => r.mr).length;
  $("stats").replaceChildren(
    statCard("Open tickets", rows.length, "Assigned to you", "var(--accent)"),
    statCard("Patch ready", patched, `${rows.length - patched} still missing`, "var(--ok)"),
    statCard("MR opened", withMr, `${rows.length - withMr} without an MR`, "var(--accent-2)"),
    statCard("Needs attention", rows.filter(attention).length, "Merged MR or patch without MR", "var(--warn)"));
  $("n-todo").textContent = rows.length;
  if (!shown.length) return $("content").replaceChildren(empty(rows.length ? "No matches" : "Inbox zero", rows.length ? "Try a different filter." : "No tickets in To Do."));

  const body = el("tbody");
  for (const r of shown) {
    body.append(el("tr", {},
      el("td", {}, link(r.url, r.key, "key"), attention(r) ? el("span", { class: "attn", title: attention(r) }, pill("Attention", "warn")) : null),
      el("td", { class: "mono", textContent: r.vuln_id }),
      el("td", {}, el("span", { class: "eco", textContent: r.ecosystem || "—" })),
      el("td", { class: "pkg", textContent: r.package }),
      el("td", { class: "ver mono", textContent: r.version }),
      el("td", {}, r.patch === "yes" ? pill("Ready", "ok") : pill("Missing", "off")),
      ...mrCells(r)));
  }
  const head = ["Ticket", "Vulnerability", "Ecosystem", "Package", "Version", "Patch", "MR", ""].map(h => el("th", { textContent: h }));
  $("content").replaceChildren(el("div", { class: "card" },
    el("div", { class: "card-h" }, el("h2", { textContent: "Tickets" }), pill(shown.length + (filtersActive() ? " of " + rows.length : ""), "plain")),
    el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, ...head)), body))));
}

const COLORS = ["#6366f1", "#0ea5e9", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#14b8a6", "#ef4444"];
function colorFor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function who(name) {
  const auto = /automation/i.test(name), me = name === "You";
  const av = el("span", { class: "av", style: `--c:${auto ? "#64748b" : me ? "var(--accent)" : colorFor(name)}` });
  if (auto) av.append(icon("i-bolt")); else av.textContent = me ? "Y" : name.split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase();
  return el("span", { class: "who" }, av, name);
}

function statusPill(name) {
  if (!name) return el("span", { class: "none", textContent: "—" });
  return pill(name, /^(done|resolved|closed|complete)/i.test(name) ? "ok" : /won.?t|reject|cancel|duplicate/i.test(name) ? "warn" : "off");
}

function renderDone() {
  const rows = data.done; if (!rows) return;
  const q = $("q").value.trim().toLowerCase();
  const eco = syncEco(rows), pkg = syncPkg(rows, eco), ver = syncVer(rows, eco, pkg);
  const by = syncBy(rows);
  const shown = rows.filter(r => (!eco || r.ecosystem === eco) && (!pkg || r.package === pkg) && (!ver || r.version === ver)
    && (!$("mrf").value || mrKind(r) === $("mrf").value)
    && (!by || r.resolved_by === by)
    && match(q, r.key, r.resolved_by, r.date, r.package, r.version, r.vuln_id, r.status, r.ecosystem));
  view.done = shown;
  $("title").textContent = "Done"; $("subtitle").textContent = "Recently resolved tickets, newest first.";
  const you = rows.filter(r => r.resolved_by === "You").length, auto = rows.filter(r => /automation/i.test(r.resolved_by)).length;
  $("stats").replaceChildren(
    statCard("Resolved", rows.length, `Last ${$("days").value || 1} day(s)`, "var(--accent)"),
    statCard("By you", you, "Manual transitions", "var(--ok)"),
    statCard("By automation", auto, "Closed by Jira Automation", "var(--accent-2)"),
    statCard("By others", rows.length - you - auto, "Teammates", "var(--warn)"));
  $("n-done").textContent = rows.length;
  if (!shown.length) return $("content").replaceChildren(empty(rows.length ? "No matches" : "Nothing yet", rows.length ? "Try a different filter." : "No tickets resolved in this window."));

  const today = new Date().toLocaleDateString("sv"), yest = new Date(Date.now() - 864e5).toLocaleDateString("sv");
  const groups = {}; shown.forEach(r => (groups[r.date] ||= []).push(r));
  const cards = Object.keys(groups).sort().reverse().map(d => {
    const rel = d === today ? "Today" : d === yest ? "Yesterday" : "";
    const body = el("tbody");
    groups[d].forEach(r => body.append(el("tr", {},
      el("td", {}, link(r.url, r.key, "key")), el("td", {}, el("span", { class: "eco", textContent: r.ecosystem || "—" })), el("td", { class: "pkg", textContent: r.package || "—" }), el("td", { class: "ver mono", textContent: r.version || "—" }),
      el("td", {}, who(r.resolved_by)),
      el("td", {}, statusPill(r.status)),
      el("td", { class: "num mono", textContent: new Date(r.done_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true }) }),
      ...mrCells(r))));
    return el("div", { class: "card" },
      el("div", { class: "card-h day-h" }, el("div", { class: "t" }, rel || d, rel ? el("span", { class: "d", textContent: d }) : null), pill(groups[d].length + " ticket" + (groups[d].length > 1 ? "s" : ""), "plain")),
      el("div", { class: "scroll" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", { textContent: "Ticket" }), el("th", { textContent: "Ecosystem" }), el("th", { textContent: "Package" }), el("th", { textContent: "Version" }), el("th", { textContent: "Resolved by" }), el("th", { textContent: "Status" }), el("th", { textContent: "Time" }), el("th", { textContent: "MR" }), el("th", {}))), body)));
  });
  $("content").replaceChildren(...cards);
}

function render() { tab === "todo" ? renderTodo() : renderDone(); }

async function load() {
  const my = ++reqSeq, t = tab;
  $("refresh").disabled = true; $("refresh").classList.add("spin"); notice("");
  $("content").replaceChildren(skeleton());
  try {
    const proj = encodeURIComponent($("project").value);
    data[t] = await api(t === "todo" ? `/api/todo?project=${proj}` : `/api/done?project=${proj}&days=${Math.max(1, +$("days").value || 1)}`);
    if (my !== reqSeq) return;
    render();
    if (t === "todo" && !gitlabOk) notice("Close MR is disabled — run  python3 app.py --setup-gitlab  and restart to enable it.");
  } catch (e) {
    if (my === reqSeq) { $("content").replaceChildren(); $("stats").replaceChildren(); notice("Couldn’t load tickets: " + e.message, true); }
  } finally { if (my === reqSeq) { $("refresh").disabled = false; $("refresh").classList.remove("spin"); } }
}

function show(t) {
  tab = t;
  $("tab-todo").classList.toggle("active", t === "todo"); $("tab-done").classList.toggle("active", t === "done");
  $("days-wrap").hidden = t !== "done"; $("stats").replaceChildren();
  $("patch-f").hidden = $("attn-f").hidden = t !== "todo"; $("by-f").hidden = t !== "done";
  if (t === "todo") $("byf").value = ""; else { $("patchf").value = ""; $("attnf").value = ""; }
  load();
}
/* ---------- export to txt ---------- */
function textTable(headers, rows) {
  const w = headers.map((h, i) => Math.max(h.length, ...rows.map(r => String(r[i]).length)));
  const line = cells => cells.map((c, i) => String(c).padEnd(w[i])).join(" | ").trimEnd();
  return [line(headers), w.map(n => "-".repeat(n)).join("-+-"), ...rows.map(line)].join("\n");
}
function buildTxt() {
  const rows = view[tab];
  if (tab === "todo") {
    const body = rows.map(r => [r.url, r.vuln_id, r.ecosystem, r.package, r.version, r.patch]);
    return textTable(["Jira Ticket", "Vulnerability ID", "Ecosystem", "Package Name", "Vulnerable Version", "Patch"], body) + `\n\nTotal: ${rows.length} ticket(s) in To Do\n`;
  }
  const today = new Date().toLocaleDateString("sv"), yest = new Date(Date.now() - 864e5).toLocaleDateString("sv");
  const groups = {}; rows.forEach(r => (groups[r.date] ||= []).push(r));
  const parts = Object.keys(groups).sort().reverse().map(d => {
    const rel = d === today ? "  (Today)" : d === yest ? "  (Yesterday)" : "";
    const body = groups[d].map(r => [r.url, r.vuln_id, r.ecosystem, r.package, r.version, r.resolved_by, r.status,
      new Date(r.done_at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true })]);
    return `--- ${d}${rel}  (${groups[d].length} ticket(s)) ---\n` + textTable(["Jira Ticket", "Vulnerability ID", "Ecosystem", "Package Name", "Vulnerable Version", "Resolved By", "Status", "Time"], body);
  });
  return parts.join("\n\n") + `\n\nTotal: ${rows.length} ticket(s)\n`;
}
$("export").onclick = () => {
  if (!view[tab].length) return toast("Nothing to export.", true);
  const url = URL.createObjectURL(new Blob([buildTxt()], { type: "text/plain;charset=utf-8" }));
  const a = el("a", { href: url, download: `${tab === "todo" ? "todo" : "done"}_issues_${new Date().toLocaleDateString("sv")}.txt` });
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(`Exported ${view[tab].length} ticket(s)`);
};

$("tab-todo").onclick = () => show("todo");
$("tab-done").onclick = () => show("done");
$("refresh").onclick = load;
$("days").onchange = load; $("project").onchange = () => { data = { todo: null, done: null }; load(); };
$("q").oninput = render;
["eco", "pkg", "ver", "mrf", "patchf", "byf", "attnf"].forEach(id => $(id).onchange = render);
$("clear").onclick = () => { ["eco", "pkg", "ver", "mrf", "patchf", "byf", "attnf"].forEach(id => $(id).value = ""); $("q").value = ""; render(); };

(async () => {
  try { const c = await api("/api/config"); $("project").value = c.project; gitlabOk = c.gitlab; } catch (e) {}
  show("todo");
})();
</script>
</body>
</html>
